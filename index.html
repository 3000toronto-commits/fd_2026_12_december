<html lang="ru">
 <head>

  <style>
:root {
  --blue: #2e62a2;
  --pale: #e2ecf5;
  --orange: #F5811F;
  --sage: #A9B7A3;
  --milk: #F7F6F1;
  --ink: #2A2F33;
  --white: #fff;
}

* {
  box-sizing: border-box;
}

html,body {
  margin: 0;
  width: 100%;
  font-family: Arial,"DejaVu Sans",sans-serif;
  color: var(--ink);
  background: var(--milk);
}

.frame {
  width: 757px;
  max-width: 100%;
  height: 600px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid #d5e0e7;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  flex: none;
  background: var(--milk);
  padding: 17px 19px 12px;
  border-bottom: 1px solid #e1e8ec;
}

.eyebrow {
  color: var(--blue);
  font-weight: 700;
  font-size: 10px;
  letter-spacing: .11em;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.titlebar {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
}

.titlebar h1 {
  font-size: 20px;
  line-height: 1.2;
  letter-spacing: -.025em;
  margin: 0;
  font-weight: 760;
}

.year {
  color: var(--orange);
  font-size: 12px;
  font-weight: 800;
  background: #fff;
  padding: 6px 9px;
  border-radius: 7px;
}

.tabs {
  display: flex;
  gap: 7px;
  margin-top: 13px;
}

.tab {
  border: 1px solid #d4dfeb;
  background: #fff;
  color: var(--blue);
  font-size: 12px;
  font-weight: 700;
  padding: 9px 13px;
  border-radius: 7px;
  white-space: nowrap;
  cursor: pointer;
  flex: 1;
}

.tab[aria-selected=true] {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

.tab:focus-visible,.action:focus-visible,input:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 2px;
}

.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-top: 11px;
  font-size: 11px;
  color: #5b6870;
}

.progress {
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.progressbar {
  width: 86px;
  height: 7px;
  background: #dbe6df;
  border-radius: 10px;
  overflow: hidden;
}

.progressfill {
  width: 0;
  height: 100%;
  background: #7e9a76;
  transition: width .2s;
}

.scroll-region {
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1;
  min-height: 0;
  scrollbar-color: #b9c7d1 transparent;
}

.tablewrap {
  width: 100%;
}

table {
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed;
}

col.task {
  width: auto;
}

col.priority {
  width: 65px;
}

col.period {
  width: 70px;
}

thead {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--pale);
  box-shadow: 0 1px 0 #c7d8e6;
}

th {
  font-size: 11px;
  color: #204e82;
  padding: 12px 6px;
  text-align: center;
  line-height: 1.25;
  font-weight: 750;
}

th:first-child {
  text-align: left;
  padding-left: 18px;
}

th:last-child {
  padding-right: 10px;
}

td {
  padding: 11px 5px;
  border-bottom: 1px solid #e9edf1;
  vertical-align: middle;
  font-size: 12px;
  line-height: 1.4;
  overflow-wrap: anywhere;
  word-wrap: break-word;
}

td:first-child {
  padding-left: 18px;
  padding-right: 10px;
}

td:last-child {
  padding-right: 10px;
}

tbody tr:nth-child(even) {
  background: #fbfcfd;
}

tbody tr:hover {
  background: #f1f6fa;
}

.priority-cell {
  text-align: center;
  font-weight: bold;
  font-size: 13px;
}

.p1 {
  color: #b65609;
}

.p2 {
  color: var(--blue);
}

.p3 {
  color: #72787c;
}

.checkcell {
  text-align: center;
}

.check {
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  vertical-align: middle;
  width: 19px;
  height: 19px;
  background: #fff;
  border: 1.5px solid #a6b4bf;
  border-radius: 5px;
  cursor: pointer;
  position: relative;
}

.check:checked {
  background: #e1ece0;
  border-color: #839c7e;
}

.check:checked:after {
  content: "✓";
  font-family: Arial,sans-serif;
  color: #2b663c;
  position: absolute;
  left: 2px;
  top: -6px;
  font-size: 23px;
  font-weight: bold;
}

.dash {
  color: #ced6da;
  font-size: 15px;
}

.footer {
  flex: none;
  padding: 11px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-top: 1px solid #e2e9ed;
  background: var(--milk);
}

.footer .hint {
  color: #697b85;
  font-size: 10px;
  line-height: 1.3;
  max-width: 320px;
}

.actions {
  display: flex;
  gap: 7px;
}

.action {
  font: 700 11px Arial,sans-serif;
  border-radius: 7px;
  padding: 10px 11px;
  border: 1px solid #b8cbd8;
  background: #fff;
  color: var(--blue);
  cursor: pointer;
  white-space: nowrap;
}

.action.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

.action:hover {
  filter: brightness(.97);
}

.printhead {
  display: none;
}

.warn {
  display: none;
}

@media (max-width:590px) {
  header {
    padding: 12px 10px 9px;
  }

  .titlebar h1 {
    font-size: 16px;
  }

  .eyebrow {
    font-size: 9px;
  }

  .tabs {
    gap: 4px;
  }

  .tab {
    font-size: 10px;
    padding: 8px 4px;
  }

  .meta {
    font-size: 10px;
  }

  th {
    font-size: 9px;
    padding: 10px 2px;
  }

  th:first-child {
    padding-left: 9px;
  }

  td {
    font-size: 10px;
    padding: 9px 2px;
  }

  td:first-child {
    padding-left: 9px;
    padding-right: 3px;
  }

  td:last-child {
    padding-right: 5px;
  }

  col.priority {
    width: 44px;
  }

  col.period {
    width: 52px;
  }

  .check {
    width: 18px;
    height: 18px;
  }

  .footer {
    padding: 8px 9px;
  }

  .footer .hint {
    display: none;
  }

  .actions {
    width: 100%;
    justify-content: space-between;
  }

  .action {
    font-size: 11px;
  }

  .progressbar {
    width: 55px;
  }

}

@media print {
  @page {
    size: A4 landscape;
    margin: 0;
  }

  html,body {
    background: #fff !important;
    overflow: visible !important;
    width: auto !important;
    height: auto !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    padding: 12mm !important;
    box-sizing: border-box !important;
  }

  .frame {
    width: 100% !important;
    max-width: none !important;
    height: auto !important;
    display: block !important;
    border: 0 !important;
    overflow: visible !important;
  }

  .eyebrow,.tabs,.year,.meta,.footer {
    display: none !important;
  }

  header {
    padding: 0 0 12px !important;
    border: 0 !important;
    background: #fff !important;
  }

  .titlebar h1 {
    font-size: 19pt !important;
  }

  .printhead {
    display: block !important;
    font-size: 10pt;
    color: var(--blue);
    padding: 1px 0 10px;
  }

  .scroll-region {
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
  }

  .tablewrap {
    overflow: visible !important;
  }

  table {
    width: 100% !important;
    table-layout: fixed !important;
    font-size: 9pt;
  }

  col.priority {
    width: 18mm;
  }

  col.period {
    width: 23mm;
  }

  thead {
    display: table-header-group !important;
    position: static !important;
    box-shadow: none !important;
  }

  tbody tr {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  th {
    font-size: 9pt;
    padding: 8px;
  }

  td {
    font-size: 9pt;
    padding: 9px 6px;
  }

  td:first-child,th:first-child {
    padding-left: 10px;
  }

  .check {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .check:checked:after {
    content: "✓";
  }

  .print-progress {
    display: none !important;
  }

  .warn {
    display: block;
    font-size: 8pt;
    color: #6b767e;
    margin-top: 10px;
  }

}
</style>

const NAMES={buh:'Бухгалтерия',kaz:'Казначейство',peo:'Планово-экономический отдел'};
const STORAGE='cfo-dec-2026-checks-v1';
let dept='buh';
let state={};
try{state=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(e){state={}}
const body=document.getElementById('tasks');
const progressLabel=document.getElementById('progress-label');
const progressFill=document.getElementById('progress-fill');
const current=document.getElementById('dept-label');
const printhead=document.getElementById('printhead');
const printProgress=document.getElementById('print-progress');
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}function stats(){const d=DATA[dept];
const total=d.reduce((a,t)=>a+t.slots.length,0);
const completed=d.reduce((a,t)=>a+t.slots.filter(s=>!!state[t.id+'-'+s]).length,0);
progressLabel.textContent=`${completed} из ${total} отметок`;
progressFill.style.width=(total?completed/total*100:0)+'%';
printProgress.textContent=`Выполнено: ${completed} из ${total} отметок`;
}function render(){document.querySelectorAll('[data-dept]').forEach(btn=>{btn.setAttribute('aria-selected',btn.dataset.dept===dept?'true':'false');
btn.tabIndex=btn.dataset.dept===dept?0:-1});
current.textContent=NAMES[dept]+' · задачи на месяц';
printhead.textContent=NAMES[dept]+' · декабрь 2026 года';
body.replaceChildren();
DATA[dept].forEach((task,index)=>{const tr=document.createElement('tr');
const title=document.createElement('td');
title.textContent=task.text;
tr.appendChild(title);
const p=document.createElement('td');
p.className='priority-cell p'+task.p;
p.textContent=task.p;
tr.appendChild(p);
for(let s=0;
s<3;
s++){const cell=document.createElement('td');
cell.className='checkcell';
if(task.slots.includes(s)){const box=document.createElement('input');
box.type='checkbox';
box.className='check';
box.checked=!!state[task.id+'-'+s];
box.setAttribute('aria-label',task.text+', '+['1–10','11–20','21–31'][s]+' декабря');
box.addEventListener('change',()=>{state[task.id+'-'+s]=box.checked;
save();
stats()});
cell.appendChild(box)}else{const dash=document.createElement('span');
dash.className='dash';
dash.textContent='·';
dash.setAttribute('aria-hidden','true');
cell.appendChild(dash)}tr.appendChild(cell)}body.appendChild(tr)});
stats();
document.getElementById('scroll').scrollTop=0;
}document.querySelectorAll('[data-dept]').forEach(btn=>btn.addEventListener('click',()=>{dept=btn.dataset.dept;
render()}));
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Снять все отметки только в календаре «'+NAMES[dept]+'»?'))return;
for(const t of DATA[dept])for(const s of t.slots)delete state[t.id+'-'+s];
save();
render()});
document.getElementById('export').addEventListener('click',()=>{document.title='Календарь_'+NAMES[dept].replaceAll(' ','_')+'_Декабрь_2026';
window.print()});
window.addEventListener('afterprint',()=>{document.title='Календарь задач финансовой службы — декабрь 2026'});
render();
</script>
